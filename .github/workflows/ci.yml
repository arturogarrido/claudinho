name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's runs share one group per ref, and a new push cancels the
# run still in flight to save minutes. A push to main gets a group of its own
# (its SHA): a group holds one running and one pending run and a newly queued
# run cancels and replaces the pending one, so in a shared group a merge
# commit's run still pending would be cancelled by the next merge's.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to full commit SHAs (not tags): a re-pointed tag on a
# third-party action would otherwise execute arbitrary code in these jobs — and
# publish.yml (same pins) holds the npm OIDC credential. Dependabot keeps SHA
# pins updated; the trailing comment records the human-readable version.

jobs:
  build-test:
    name: build · typecheck · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung test must fail in minutes, not burn the 6h default
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 (our pinned packageManager) requires Node >= 22.13 and tsup 9
        # >= 22.18, so the toolchain runs on 22/24. The published packages target
        # Node >= 22 — that floor is verified by the `runtime-node22` job below.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6 — reads pnpm version from package.json "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true # the newest patch of the line, not the runner's cached one
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build first, in topological order — cli/mcp import @claudinho/core from
      # its built dist, so typecheck/test need it present.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm lint # Biome (real linter, replaces the former no-op)

      # The MCP server over REAL stdio — the transport every install channel
      # (Registry npx, Cursor plugin, Claude Code) actually launches, which the
      # vitest suite never exercises (it imports handlers in-process).
      - name: MCP server stdio smoke
        run: pnpm -F @claudinho/mcp smoke:stdio

      # Tarball contents: nothing ships beyond dist/README/LICENSE, never a
      # .mcpb or anything under docs/ (and git must track nothing under docs/).
      - name: Pack contents guard
        run: node scripts/check-pack.mjs

  runtime-node22:
    name: runtime smoke (Node 22 engines floor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Build with a pnpm-supported Node...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true # the newest patch of the line, not the runner's cached one
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # ...then run the built artifacts under Node 22.0.0, the lowest version
      # we advertise (engines.node >= 22), to confirm the shipped code works there.
      # Uses offline-only commands (bundled schedule, no network).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.0.0
      - name: Exercise the built CLI on Node 22.0.0
        # Nothing is followed on a fresh runner (0.11: no default competition),
        # so the competition is chosen per command, by its alias.
        run: |
          node --version
          node packages/cli/dist/index.js --competition world-cup next MEX
          node packages/cli/dist/index.js --competition world-cup table A
          node packages/cli/dist/index.js vibe
          echo "Node 22.0.0 runtime OK"
      # The engines floor applies to the MCP server and the statusline too —
      # plain `node` invocations (pnpm itself needs >= 22.13, so no pnpm here).
      - name: MCP server stdio smoke on Node 22.0.0
        run: node packages/mcp/scripts/stdio-smoke.mjs
      - name: Statusline smoke on Node 22.0.0 (seeded cache, offline)
        run: node scripts/smoke-statusline.mjs

  os-matrix:
    # The CLI ships to macOS/Windows users (statusline installs on both), but
    # nothing had ever EXECUTED on them in CI — cache tmp+rename, the detached
    # refresher spawn, and ~/.claude writes are all platform-sensitive.
    name: build · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The first windows leg hung for an hour on a blocking stdin read — cap the
    # blast radius of any future platform hang.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true # the newest patch of the line, not the runner's cached one
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Offline CLI smoke (bundled schedule, no network)
        # Nothing is followed on a fresh runner (0.11: no default competition),
        # so the competition is chosen per command, by its alias.
        run: |
          node packages/cli/dist/index.js --competition world-cup next MEX
          node packages/cli/dist/index.js --competition world-cup table A
      - name: Statusline smoke (seeded cache)
        run: node scripts/smoke-statusline.mjs
      - name: MCP server stdio smoke
        run: node packages/mcp/scripts/stdio-smoke.mjs

  coverage:
    # Visibility only, never a gate: publishes per-package V8 coverage so blind
    # spots are inspectable (several shipped bugs were "the branch nobody
    # rendered"). Thresholds are a deliberate non-goal for now.
    name: coverage (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true # the newest patch of the line, not the runner's cached one
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Test with V8 coverage
        # No `--` separator: pnpm forwards unrecognized options to the script;
        # with `--` the flags never reach vitest (verified locally).
        run: pnpm -r test --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-summaries
          path: packages/*/coverage/coverage-summary.json
          if-no-files-found: warn

  audit:
    # A required check, so it always reports under this name (no job-level
    # `if:`). On a pull request it audits only when the dependency tree or this
    # workflow changes (pnpm-lock.yaml, pnpm-workspace.yaml, any package.json,
    # ci.yml), read from GitHub's merge commit against its first parent; any
    # failure to read that difference audits. A rename counts as a change to both
    # of its paths (--no-renames). Every other event, a push to main
    # included, always audits. A third-party advisory published against an
    # unchanged tree is left to Dependabot's alerts, not to an unrelated PR.
    name: audit (shipped deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge commit and its first parent (the base branch's tip).
          fetch-depth: 2
      - name: Decide whether the dependency tree changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          audit=false
          if [ "$EVENT_NAME" != "pull_request" ]; then
            audit=true
            echo "Event '$EVENT_NAME' is not a pull request: auditing."
          elif ! files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD 2>&1); then
            audit=true
            echo "Could not read the pull request's changed files, so auditing: $files"
          else
            while IFS= read -r f; do
              case "$f" in
                pnpm-lock.yaml | pnpm-workspace.yaml | .github/workflows/ci.yml | package.json | */package.json)
                  audit=true
                  echo "Changed: $f (decides the dependency tree): auditing."
                  ;;
                \"*)
                  audit=true
                  echo "Changed: $f (a quoted path, not read exactly): auditing."
                  ;;
              esac
            done <<< "$files"
            if [ "$audit" = false ]; then
              echo "Audit skipped: no file that decides the dependency tree changed."
            fi
          fi
          echo "audit=$audit" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true # the newest patch of the line, not the runner's cached one
          cache: pnpm
      - name: Install
        if: steps.changed.outputs.audit == 'true'
        run: pnpm install --frozen-lockfile

      # Gate the build only on vulnerabilities in *shipped* (production) deps —
      # dev-toolchain CVEs are caught by Dependabot but shouldn't block CI.
      - name: Audit production dependencies
        if: steps.changed.outputs.audit == 'true'
        run: pnpm audit --prod

      # Surface dev-toolchain advisories for visibility, without failing.
      - name: Audit all dependencies (non-blocking)
        if: steps.changed.outputs.audit == 'true'
        run: pnpm audit || true

  # The Claude Code plugin (packages/plugin, no package.json and no dependencies): its manifest, the root marketplace
  # file and its hooks module validated, and its tests (packages/plugin-tests, kept out of the folder that installs)
  # run against it by the engine's own kit through scripts/plugin-test.sh, under the pinned Claude Code CLI.
  # The job's name carries no version, so a pin bump leaves the ruleset's required check as it is.
  plugin:
    name: plugin (validate · test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true # the newest patch of the line, not the runner's cached one
      - run: npm install -g @anthropic-ai/claude-code@2.1.310
      - run: |
          claude plugin validate .
          claude plugin validate packages/plugin
          bash scripts/plugin-test.sh
