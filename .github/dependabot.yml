# Dependabot **version updates** (routine bump PRs).
#
# This is separate from Dependabot **security alerts**, which are enabled in the
# GitHub UI (Security tab) and already flag vulnerable deps. This file opens the
# regular update PRs that keep the toolchain current.
#
# NOTE: opening PRs also requires the repo setting Settings -> Actions -> General
# -> "Allow GitHub Actions to create and approve pull requests" to be ON. With it
# OFF, Dependabot pushes update branches but silently fails to open the PR (you
# get orphan dependabot/* branches and no PRs).
version: 2
updates:
  # npm / pnpm workspace (root lockfile covers all packages/*).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group the noisy minor/patch bumps; majors still come as individual PRs so
    # they get a deliberate review.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    # @types/node tracks the Node version we support (engines floor: Node 20),
    # not the newest Node major. Skip major-version PRs (e.g. 22 -> 25): a newer
    # major types APIs that may not exist on our floor. Minor/patch still flow.
    #
    # typescript majors are skipped too: TS 7 is the native (Go) compiler rewrite,
    # and our build toolchain (tsup + its dts plugins) doesn't support the changed
    # compiler API yet -- 5.9.3 -> 7.0.2 broke every build/typecheck job (PR #84,
    # `Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')`).
    # Adopting TS 7 is a deliberate migration gated on that tooling, not a routine
    # bump. Minor/patch on the 5.x/6.x line still flow.
    #
    # zod majors are skipped: zod is a RUNTIME dep of @claudinho/mcp and the MCP
    # SDK derives every tool's inputSchema/outputSchema from it. Measured on the
    # 3.25 -> 4.5 bump (PR #112): tools/list changed by 710 lines -- every
    # inputSchema lost `additionalProperties: false`, all `$ref`s were inlined,
    # keys reordered -- i.e. an MCP-AFFECTING change (Registry republish, .mcpb
    # rebuild, Smithery re-score) even though the test suite stayed green (and
    # `tsc` did not: zod 4's two-argument `z.record` fails typecheck, which
    # vitest never runs). 0.10.0 moved the package to zod 4 through its bundled
    # `zod/v3` entry point, which keeps every advertised schema byte-identical;
    # migrating the declarations to zod 4 classic is tied to an MCP-affecting
    # release. The next major (5.x) gets the same treatment. Minor/patch on the
    # 4.x line still flow.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions used in CI up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
