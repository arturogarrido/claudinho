packages:
  - "packages/*"
  - "services/*"
  - "apps/*"

# Force vulnerable transitive dependencies up to patched versions.
# - vite/esbuild: dev tooling (GHSA path-traversal in vite; esbuild dev-server
#   request leak). vitest 4 otherwise reuses the older vite 5 / esbuild 0.21.
#
# NO override for the @modelcontextprotocol/sdk HTTP stack (hono,
# @hono/node-server, fast-uri via ajv, body-parser via express), deliberately.
# Every advisory against them is an HTTP-server feature (CORS, serve-static,
# body-limit, URI parsing) that our stdio MCP server never loads — the built
# dist imports exactly sdk/server/mcp.js, sdk/server/stdio.js and zod — but
# `pnpm audit --prod` gates on versions, not reachability. The remedy is a
# LOCKFILE RE-RESOLUTION (`pnpm update`), not a version floor: the previous
# `hono@<4.12.25: >=4.12.25` override (added v0.5.1) went stale and ended up
# pinning 4.12.25, which is exactly what the next advisory batch flagged. The
# sdk floor (^1.30.0 in packages/mcp) is what makes @hono/node-server 2.x
# semver-legal — 1.29.0 declared ^1.19.9, 1.30.0 declares ^1.19.9 || ^2.0.5.
overrides:
  vite: "^6.4.2"
  esbuild: ">=0.28.1"

# esbuild (via tsup + vitest) ships its native binary through the
# @esbuild/<platform> optional dependency, so its own postinstall (node
# install.js) isn't needed. Decline the build script explicitly (pnpm 11's
# allowBuilds map) so install stops prompting/warning, and turn off the pre-run
# deps check that would otherwise escalate the skipped build to a hard error and
# block every script (even a pure-tsc typecheck).
allowBuilds:
  esbuild: false
verifyDepsBeforeRun: false
